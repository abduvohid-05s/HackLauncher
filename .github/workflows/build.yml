name: Build RainFx
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q RainFx_Project.zip -d proj
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle -p proj assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk RainFx.apk
          gh release delete rainfx-latest --yes --cleanup-tag || true
          gh release create rainfx-latest RainFx.apk --title "RainFx APK" --notes "Auto build"
